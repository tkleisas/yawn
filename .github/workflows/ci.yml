name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-type: Release
          # Same container as release.yml's Linux leg (see the comments
          # there): builds against jammy's glibc 2.35 so CI and the
          # release artifacts match, and the ubuntu-22.04 VM-image
          # deprecation doesn't touch us.
          - os: ubuntu-24.04
            platform: linux
            build-type: Release
            container-image: ubuntu:22.04

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container-image || '' }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      # Windows only — see release.yml: setup-python's toolcache CPython
      # needs GLIBC_2.38 and shadows the container's own python3.
      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Container-only CMake upgrade — see release.yml for the long
      # version. jammy ships 3.22; the project needs 3.24+.
      - name: Install CMake ≥ 3.24 (Linux container)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates gnupg wget curl pkg-config python3-pip
          url='https://github.com/tkleisas/yawn/releases/download/deps/kitware-2026.asc'
          sha256='801bc629e356c3c96f184351272914222ce427777400fa7d1baed3ab180b3e3b'
          curl -L -f -sS -o /tmp/kitware.asc "$url"
          echo "$sha256  /tmp/kitware.asc" | sha256sum -c - >/dev/null || {
            echo "Kitware key sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          gpg --dearmor < /tmp/kitware.asc > /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y cmake

      # sudo doesn't exist in the bare ubuntu:22.04 container image.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            python3-pip \
            gcc-12 \
            g++-12 \
            ccache \
            xvfb

      # Same mirror as release.yml — CI and releases must compile against
      # the same FFmpeg headers (apt's 4.4 in jammy is outside the shim's
      # verified-family contract). Headers only on Linux; no link.
      - name: Install FFmpeg (Linux, from deps mirror)
        if: runner.os == 'Linux'
        run: |
          set -eu
          url='https://github.com/tkleisas/yawn/releases/download/deps/libff.tar.xz'
          sha256='43adb2b286dce7138432554fc772aa265914db35c70be0fc57b6715029cd10c1'
          curl -L -f -sS -o /tmp/libff.tar.xz "$url"
          echo "$sha256  /tmp/libff.tar.xz" | sha256sum -c - >/dev/null || {
            echo "FFmpeg tarball sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          mkdir -p /opt/ffmpeg
          tar -xf /tmp/libff.tar.xz -C /opt/ffmpeg --strip-components=1

      # Prebuilt FFmpeg (shared, includes headers + import libs + DLLs +
      # ffmpeg.exe/ffprobe.exe). BtbN publishes these under their
      # autobuild releases on GitHub; pinned to a dated autobuild (the
      # "latest" alias floats and would change the toolchain underneath
      # us mid-release). Exports FFMPEG_ROOT so CMake's manual
      # detection path picks it up, and prepends bin/ to PATH so the
      # test binary can find the DLLs during ctest.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Mirrored in this repo's `deps` release — BtbN prunes dated
          # autobuilds within weeks (the 2026-07-18 pin 404'd), and the
          # rolling `latest` alias floats. Hash-checked so the toolchain
          # is exactly what we mirrored.
          $url = 'https://github.com/tkleisas/yawn/releases/download/deps/ffmpeg-win64.zip'
          $sha256 = '952b5fb1d32636d70ced1f8df65a51def4c576e1f8a834ee9d578ae0adc8d64c'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) {
            throw "FFmpeg zip sha256 mismatch — mirror tampered or URL wrong"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "FFMPEG_ROOT=$root"
          Get-ChildItem "$root\bin" | Select-Object Name

      - name: Install Python dependencies
        run: python3 -m pip install jinja2

      # Cache the FetchContent git clones + built deps — the dominant cost of
      # the Linux build. Shares the key with release.yml so a master CI run
      # warms the cache the tagged release then reuses. Exact key only: a dep
      # change forces a clean re-fetch.
      - name: Cache FetchContent deps (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      # Same for Windows — the deps were previously re-cloned from
      # scratch on every run (and, with unpinned tags, could yield a
      # different SDL than the Linux artifact of the same release).
      - name: Cache FetchContent deps (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      # Compiler cache so unchanged TUs (deps + YAWN) aren't recompiled.
      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Configure
        # Linux: pkg-config route (headers only, no libav DT_NEEDED —
        # same rationale as release.yml).
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DYAWN_HAS_BASIC_PITCH=ON -DYAWN_HAS_STEM_SEPARATION=ON ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }} ${{ runner.os == 'Windows' && format('-DPython3_EXECUTABLE="{0}/python3.exe" -DPython_EXECUTABLE="{0}/python3.exe" -DFFMPEG_ROOT="{1}"', env.pythonLocation, env.FFMPEG_ROOT) || '' }}
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'Linux' && '/opt/ffmpeg/lib/pkgconfig' || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build-type }} --output-on-failure --parallel

      # End-to-end UI smoke: drive the real app over the YAWN_CMD TCP
      # command channel under a virtual X server (llvmpipe GL). Covers
      # the get/undo/redo/wait/shot verbs against a live process.
      - name: UI smoke (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/ui_smoke.py build/bin/YAWN
        env:
          LD_LIBRARY_PATH: /opt/ffmpeg/lib   # DLL-less pack: dlopen probing

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item build/bin/Release/YAWN.exe package/
          if (Test-Path build/bin/Release/yawn_vst3_host.exe) {
            Copy-Item build/bin/Release/yawn_vst3_host.exe package/
          }
          if (Test-Path build/bin/Release/assets) {
            Copy-Item -Recurse build/bin/Release/assets package/
          }
          if (Test-Path build/bin/Release/scripts) {
            Copy-Item -Recurse build/bin/Release/scripts package/
          }
          # Bundle any runtime DLLs from the build tree
          Get-ChildItem build/bin/Release/*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination package/
          # Bundle FFmpeg runtime: DLLs (needed to launch) + ffmpeg/ffprobe
          # (used by the future Windows VideoImporter). Skip silently if
          # FFMPEG_ROOT wasn't set (video disabled build).
          if ($env:FFMPEG_ROOT -and (Test-Path "$env:FFMPEG_ROOT\bin")) {
            Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" package/ -ErrorAction SilentlyContinue
            foreach ($exe in 'ffmpeg.exe','ffprobe.exe') {
              if (Test-Path "$env:FFMPEG_ROOT\bin\$exe") {
                Copy-Item "$env:FFMPEG_ROOT\bin\$exe" package/
              }
            }
          }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/bin/YAWN package/
          if [ -f build/bin/yawn_vst3_host ]; then
            cp build/bin/yawn_vst3_host package/
          fi
          if [ -d build/bin/assets ]; then
            cp -r build/bin/assets package/
          fi
          if [ -d build/bin/scripts ]; then
            cp -r build/bin/scripts package/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YAWN-${{ matrix.platform }}
          path: package/

  # ASan + UBSan over the full test suite. The engine's SPSC ring
  # buffers and retire-list lifetime scheme are exactly the bug class
  # these catch; the build already relaxes -Werror=uninitialized under
  # sanitizers, so no special flag wrangling is needed.
  sanitizers:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    name: Sanitizers (ASan+UBSan, Linux)

    steps:
      - uses: actions/checkout@v4

      # No setup-python: its toolcache CPython needs GLIBC_2.38 and
      # shadows the container's own python3 (see release.yml). apt
      # python3 + python3-pip (in the package list below) is enough.
      - name: Install CMake ≥ 3.24 (Linux container)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates gnupg wget curl pkg-config python3-pip
          url='https://github.com/tkleisas/yawn/releases/download/deps/kitware-2026.asc'
          sha256='801bc629e356c3c96f184351272914222ce427777400fa7d1baed3ab180b3e3b'
          curl -L -f -sS -o /tmp/kitware.asc "$url"
          echo "$sha256  /tmp/kitware.asc" | sha256sum -c - >/dev/null || {
            echo "Kitware key sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          gpg --dearmor < /tmp/kitware.asc > /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y cmake

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev ccache python3-pip gcc-12 g++-12

      - name: Install FFmpeg (from deps mirror)
        run: |
          set -eu
          url='https://github.com/tkleisas/yawn/releases/download/deps/libff.tar.xz'
          sha256='43adb2b286dce7138432554fc772aa265914db35c70be0fc57b6715029cd10c1'
          curl -L -f -sS -o /tmp/libff.tar.xz "$url"
          echo "$sha256  /tmp/libff.tar.xz" | sha256sum -c - >/dev/null || {
            echo "FFmpeg tarball sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          mkdir -p /opt/ffmpeg
          tar -xf /tmp/libff.tar.xz -C /opt/ffmpeg --strip-components=1

      - name: Install Python dependencies
        run: python3 -m pip install jinja2

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: linux-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-asan-${{ github.sha }}
          restore-keys: |
            linux-ccache-asan-
            linux-ccache-

      - name: Configure
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        env:
          PKG_CONFIG_PATH: /opt/ffmpeg/lib/pkgconfig

      - name: Build
        # -j2, not --parallel: ASan+UBSan instrumented TUs peak at
        # multiple GB each — 4-way parallel OOM'd the 16 GB runner
        # (exit 143 after ~20 min). Slower but it finishes (and the
        # ccache makes subsequent runs fast).
        run: cmake --build build-asan --parallel 2 --target yawn_tests

      - name: Test
        working-directory: build-asan
        run: ./bin/yawn_tests

  # Debug build: the assert()s in src/ (e.g. AudioBuffer bounds checks)
  # compile out under NDEBUG in the Release-only matrix, so this is the
  # only job where they actually fire.
  debug:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    name: Debug (asserts enabled, Linux)

    steps:
      - uses: actions/checkout@v4

      # No setup-python: its toolcache CPython needs GLIBC_2.38 and
      # shadows the container's own python3 (see release.yml). apt
      # python3 + python3-pip (in the package list below) is enough.
      - name: Install CMake ≥ 3.24 (Linux container)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates gnupg wget curl pkg-config python3-pip
          url='https://github.com/tkleisas/yawn/releases/download/deps/kitware-2026.asc'
          sha256='801bc629e356c3c96f184351272914222ce427777400fa7d1baed3ab180b3e3b'
          curl -L -f -sS -o /tmp/kitware.asc "$url"
          echo "$sha256  /tmp/kitware.asc" | sha256sum -c - >/dev/null || {
            echo "Kitware key sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          gpg --dearmor < /tmp/kitware.asc > /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y cmake

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev ccache python3-pip gcc-12 g++-12

      - name: Install FFmpeg (from deps mirror)
        run: |
          set -eu
          url='https://github.com/tkleisas/yawn/releases/download/deps/libff.tar.xz'
          sha256='43adb2b286dce7138432554fc772aa265914db35c70be0fc57b6715029cd10c1'
          curl -L -f -sS -o /tmp/libff.tar.xz "$url"
          echo "$sha256  /tmp/libff.tar.xz" | sha256sum -c - >/dev/null || {
            echo "FFmpeg tarball sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          mkdir -p /opt/ffmpeg
          tar -xf /tmp/libff.tar.xz -C /opt/ffmpeg --strip-components=1

      - name: Install Python dependencies
        run: python3 -m pip install jinja2

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          PKG_CONFIG_PATH: /opt/ffmpeg/lib/pkgconfig

      # -j2, not --parallel: Debug-info TUs (ONNX/Eigen C++20 + SDL)
      # peak at multiple GB each — 4-way parallel OOM'd the 16 GB
      # runner mid-build (Build step died with conclusion: null).
      # Same fix as the sanitizers job above.
      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel
