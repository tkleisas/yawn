name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger: builds + uploads the packaged artifacts (incl. the
  # bundled model + ONNX Runtime) for inspection WITHOUT publishing a
  # GitHub release — the `release` job is gated to tag pushes only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-type: Release
            archive-ext: zip
          # Pinned (not ubuntu-latest) — and on Linux, pinned twice over:
          #   1. The VM image stays floating (the ubuntu-22.04 *image* is
          #      being deprecated); the Linux job instead runs in an
          #      `ubuntu:22.04` container. The glibc the binary is built
          #      against comes from the container (2.35), which becomes
          #      the distro portability floor — anything ≥ Ubuntu 22.04 /
          #      Debian 12 / RHEL 9, vs 24.04's 2.39 floor that failed the
          #      appimage.github.io catalog test on older distros.
          #   2. jammy ships CMake 3.22; the project needs 3.24+
          #      (WHOLE_ARCHIVE generator expression), so Kitware's apt
          #      repo is wired in below.
          - os: ubuntu-24.04
            platform: linux
            build-type: Release
            container-image: ubuntu:22.04
            archive-ext: tar.gz

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container-image || '' }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version tag

      # Windows only — see the Linux comment below: setup-python's
      # toolcache CPython needs GLIBC_2.38 and shadows the container's
      # own python3.
      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Container-only: the ubuntu:22.04 image ships CMake 3.22, but the
      # project needs 3.24+ (the $<LINK_LIBRARY:WHOLE_ARCHIVE,…> generator
      # expression that keeps NAM's static lib alive). Kitware's jammy apt
      # repo is the wired-in route. Their key URL rotates (kitware-current
      # 404'd after the June-2026 key rotation — wget exits 8 on a 404
      # under sh -e), so the key is mirrored: fetched from the live URL
      # when it works, otherwise the hash-pinned copy in the deps release.
      # The .asc IS the (armored) fingerprint carrier — key IDs embedded —
      # and apt only checks the repo signature against whatever key this
      # file holds, so a mismatch surfaces at apt-get update, not silently.
      - name: Install CMake ≥ 3.24 (Linux container)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates gnupg wget curl xz-utils python3-pip
          url='https://github.com/tkleisas/yawn/releases/download/deps/kitware-2026.asc'
          sha256='801bc629e356c3c96f184351272914222ce427777400fa7d1baed3ab180b3e3b'
          curl -L -f -sS -o /tmp/kitware.asc "$url"
          echo "$sha256  /tmp/kitware.asc" | sha256sum -c - >/dev/null || {
            echo "Kitware key sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          gpg --dearmor < /tmp/kitware.asc > /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y cmake pkg-config
          cmake --version | head -1

      # sudo doesn't exist in the bare ubuntu:22.04 container image.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            git \
            curl \
            xz-utils \
            ccache \
            gcc-12 \
            g++-12

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Mirrored in this repo's `deps` release — BtbN prunes dated
          # autobuilds within weeks (the 2026-07-18 pin 404'd), and the
          # rolling `latest` alias floats. Hash-checked so the toolchain
          # is exactly what we mirrored.
          $url = 'https://github.com/tkleisas/yawn/releases/download/deps/ffmpeg-win64.zip'
          $sha256 = '952b5fb1d32636d70ced1f8df65a51def4c576e1f8a834ee9d578ae0adc8d64c'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) {
            throw "FFmpeg zip sha256 mismatch — mirror tampered or URL wrong"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Linux: same mirror strategy as the Windows FFmpeg above. apt's
      # libavcodec-dev in the 22.04 container is FFmpeg 4.4 — outside the
      # families FfmpegShim probes (6.x/7.x) and not ABI-verified against
      # the shim's struct-access contract — so the build links *nothing*
      # and the headers instead come from BtbN's n6.1.3 shared build,
      # mirrored into the `deps` release (upstream prunes dated autobuilds
      # within weeks; the mirror doesn't). The same tarball supplies the
      # libav* runtime for the AppImage, so decode/capture sonames and the
      # bundled checkout can never drift apart. Portable across old
      # distros too: the closure needs at most GLIBC_2.28 (CLI: 2.14).
      - name: Install FFmpeg (Linux, from deps mirror)
        if: runner.os == 'Linux'
        run: |
          set -eu
          url='https://github.com/tkleisas/yawn/releases/download/deps/libff.tar.xz'
          sha256='43adb2b286dce7138432554fc772aa265914db35c70be0fc57b6715029cd10c1'
          curl -L -f -sS -o /tmp/libff.tar.xz "$url"
          echo "$sha256  /tmp/libff.tar.xz" | sha256sum -c - >/dev/null || {
            echo "FFmpeg tarball sha256 mismatch — mirror tampered or URL wrong"; exit 1; }
          mkdir -p /opt/ffmpeg
          tar -xf /tmp/libff.tar.xz -C /opt/ffmpeg --strip-components=1
          echo "FFMPEG_ROOT=/opt/ffmpeg" >> "$GITHUB_ENV"
          # The binary needs its own libav* for a plain `-version` run; the
          # build itself never links them (headers only), but the smoke
          # check below runs the CLI, so preview the runtime here.
          LD_LIBRARY_PATH=/opt/ffmpeg/lib /opt/ffmpeg/bin/ffmpeg -version | head -1

      # No setup-python on Linux: its toolcache CPython is built for the
      # newer runner images and needs GLIBC_2.38 — inside the jammy
      # container it not only fails to load, it SHADOWS the container's
      # own python3 on PATH. apt python3 (3.10) + python3-pip is enough
      # for glad2's codegen (just needs jinja2).
      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        run: python3 -m pip install jinja2

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install jinja2

      # Cache the FetchContent git clones + built deps (SDL3, NAM, ableton_link,
      # VST3 SDK, eigen, …) — the dominant cost of the Linux build. Keyed on the
      # dependency declarations; an exact hit skips the ~1.2 GB of re-cloning
      # entirely. No restore-keys: a dep change must force a clean re-fetch.
      - name: Cache FetchContent deps (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      # Compiler cache so unchanged TUs (deps + YAWN) aren't recompiled. The
      # rolling key + restore-keys keeps a warm cache across releases; ccache
      # validates by content hash, so a stale restore is safe (just misses).
      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Configure
        # Linux must go through the pkg-config route on purpose: it's the
        # one POSIX path where CMakeLists links NO libav libraries (only
        # headers — FfmpegShim dlopen()s the rest at runtime). Passing
        # FFMPEG_ROOT on Linux would hit the manual route and hard-link
        # DT_NEEDED entries back into the binary. BtbN ships .pc files,
        # so PKG_CONFIG_PATH steers route 1 at the mirror checkout.
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DYAWN_HAS_STEM_SEPARATION=ON -DYAWN_HAS_BASIC_PITCH=ON ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || format('-DPython3_EXECUTABLE="{0}/python3.exe" -DPython_EXECUTABLE="{0}/python3.exe" -DFFMPEG_ROOT="{1}"', env.pythonLocation, env.FFMPEG_ROOT) }}
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'Linux' && '/opt/ffmpeg/lib/pkgconfig' || '' }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build-type }} --output-on-failure --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "YAWN-${version}-windows"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item build/bin/Release/YAWN.exe $dir/
          if (Test-Path build/bin/Release/yawn_vst3_host.exe) {
            Copy-Item build/bin/Release/yawn_vst3_host.exe $dir/
          }
          if (Test-Path build/bin/Release/assets) {
            Copy-Item -Recurse build/bin/Release/assets $dir/
          }
          if (Test-Path build/bin/Release/scripts) {
            Copy-Item -Recurse build/bin/Release/scripts $dir/
          }
          Get-ChildItem build/bin/Release/*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dir/
          # Bundle the Demucs stem-separation model so the app is self-
          # contained (onnxruntime.dll is already copied via *.dll above).
          New-Item -ItemType Directory -Path "$dir/models" -Force | Out-Null
          $modelUrl = 'https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx'
          Invoke-WebRequest -Uri $modelUrl -OutFile "$dir/models/htdemucs_4s.onnx" -UseBasicParsing
          $sz = (Get-Item "$dir/models/htdemucs_4s.onnx").Length
          if ($sz -ne 170681491) { throw "Model size mismatch: $sz (expected 170681491)" }
          if ($env:FFMPEG_ROOT -and (Test-Path "$env:FFMPEG_ROOT\bin")) {
            Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" $dir/ -ErrorAction SilentlyContinue
            foreach ($exe in 'ffmpeg.exe','ffprobe.exe') {
              if (Test-Path "$env:FFMPEG_ROOT\bin\$exe") {
                Copy-Item "$env:FFMPEG_ROOT\bin\$exe" $dir/
              }
            }
          }
          Compress-Archive -Path $dir -DestinationPath "YAWN-${version}-windows.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="YAWN-${version}-linux"
          mkdir -p "$dir"
          cp build/bin/YAWN "$dir/"
          if [ -f build/bin/yawn_vst3_host ]; then
            cp build/bin/yawn_vst3_host "$dir/"
          fi
          if [ -d build/bin/assets ]; then
            cp -r build/bin/assets "$dir/"
          fi
          if [ -d build/bin/scripts ]; then
            cp -r build/bin/scripts "$dir/"
          fi
          # Bundle the ONNX Runtime shared lib beside the binary (its rpath
          # includes $ORIGIN) so stem separation / Basic Pitch run from the
          # package; -P preserves the libonnxruntime.so.1 -> .so.1.20.1 chain.
          find build/_deps -path '*onnxruntime*/lib/libonnxruntime.so*' -print0 \
            | xargs -0 cp -P -t "$dir/"
          # Bundle the Demucs stem-separation model (self-contained app).
          mkdir -p "$dir/models"
          curl -L -f -sS -o "$dir/models/htdemucs_4s.onnx" \
            "https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx"
          sz=$(stat -c%s "$dir/models/htdemucs_4s.onnx")
          if [ "$sz" != "170681491" ]; then
            echo "Model size mismatch: $sz (expected 170681491)"; exit 1
          fi
          tar czf "YAWN-${version}-linux.tar.gz" "$dir"

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        # Non-fatal for the RELEASE AS A WHOLE (tarball must publish even
        # if AppImage assembly flakes) — but the in-script gates below
        # (bundle completeness, DT_NEEDED closure) fail LOUDLY and abort
        # this step, so a half-built AppImage can never reach the release.
        continue-on-error: true
        shell: bash   # container default is sh; this script uses bashisms
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          appdir="YAWN.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/lib"

          # App + payload. assets/ and models/ are resolved relative to
          # the process CWD, so AppRun cd's into usr/bin before exec.
          cp build/bin/YAWN "$appdir/usr/bin/"
          if [ -f build/bin/yawn_vst3_host ]; then
            cp build/bin/yawn_vst3_host "$appdir/usr/bin/"
          fi
          if [ -d build/bin/assets ]; then cp -r build/bin/assets "$appdir/usr/bin/"; fi
          if [ -d build/bin/scripts ]; then cp -r build/bin/scripts "$appdir/usr/bin/"; fi

          # ONNX Runtime (rpath $ORIGIN covers usr/bin, but LD_LIBRARY_PATH
          # in AppRun also covers usr/lib — put it with the other libs).
          find build/_deps -path '*onnxruntime*/lib/libonnxruntime.so*' -print0 \
            | xargs -0 cp -P -t "$appdir/usr/lib/"

          # Demucs model (size-verified, same as the tarball).
          mkdir -p "$appdir/usr/bin/models"
          curl -L -f -sS -o "$appdir/usr/bin/models/htdemucs_4s.onnx" \
            "https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx"
          sz=$(stat -c%s "$appdir/usr/bin/models/htdemucs_4s.onnx")
          if [ "$sz" != "170681491" ]; then
            echo "Model size mismatch: $sz (expected 170681491)"; exit 1
          fi

          # ── FFmpeg runtime closure ─────────────────────────────────
          # The app dlopen()s libav* at runtime (FfmpegShim), so the
          # whole point of the AppImage is bundling them. The five libav
          # libs (plus swresample/avfilter — their DT_NEEDED, not probed
          # by the shim but required at dlopen time) come from the SAME
          # mirror tarball the build linked headers against, so sonames
          # and checkout can't drift. Their external deps are harvested
          # with the ldd walker below, skipping the libs that must come
          # from the host (core runtime / graphics / audio servers).
          # Explicit copy list, not a `find … -o -name` chain: -print0
          # binds to the last -name only (the v0.87.6 run copied just
          # libavfilter and then died on the first probed soname).
          cp -P /opt/ffmpeg/lib/libavcodec.so* \
                /opt/ffmpeg/lib/libavformat.so* \
                /opt/ffmpeg/lib/libavutil.so* \
                /opt/ffmpeg/lib/libswscale.so* \
                /opt/ffmpeg/lib/libavdevice.so* \
                /opt/ffmpeg/lib/libswresample.so* \
                /opt/ffmpeg/lib/libavfilter.so* \
                "$appdir/usr/lib/"
          bundle_lib() {
            local f="$1" base dst
            base="$(basename "$f")"
            case "$base" in
              libc.so.*|libstdc++.so.*|libm.so.*|libgcc_s.so.*|libpthread.so.*|\
              libdl.so.*|librt.so.*|ld-linux*.so.*|linux-vdso*|\
              libGL*.so.*|libEGL*.so.*|libGLX*.so.*|libGLdispatch*.so.*|\
              libasound.so.*|libjack.so.*|libpipewire*.so.*|libpulse*.so.*|\
              libX11.so.*|libxcb*.so.*|libwayland*.so.*|libdbus-1.so.*)
                return ;;
            esac
            dst="$appdir/usr/lib/$base"
            [ -f "$dst" ] && return 0
            cp -L "$f" "$dst"
            ldd "$dst" 2>/dev/null | awk '/=> \// {print $3} /^\// {print $1}' \
              | while read -r dep; do [ -n "$dep" ] && bundle_lib "$dep"; done
          }
          for soname in libavcodec.so.60 libavformat.so.60 libavutil.so.58 \
                        libswscale.so.7 libavdevice.so.60 libavfilter.so.9 \
                        libswresample.so.4; do
            bundle_lib "$appdir/usr/lib/$soname"
          done
          # Loud gate before squashing: the probed sonames must all be in
          # the bundle. continue-on-error above would happily publish a
          # partial AppImage otherwise.
          for soname in libavcodec.so.60 libavformat.so.60 libavutil.so.58 \
                        libswscale.so.7 libavdevice.so.60 libavfilter.so.9 \
                        libswresample.so.4; do
            [ -f "$appdir/usr/lib/$soname" ] || {
              echo "MISSING from bundle: $soname"; exit 1; }
          done
          # Also verify the app binary itself has no unresolved DT_NEEDED
          # the walker skipped (each entry must resolve inside usr/lib or
          # the host denylist).
          missing=$(LD_LIBRARY_PATH="$appdir/usr/lib" ldd "$appdir/usr/bin/YAWN" 2>/dev/null | awk '/not found/ {print $1}' | sort -u)
          if [ -n "$missing" ]; then
            echo "Unresolved DT_NEEDED for YAWN:"; echo "$missing"; exit 1
          fi

          # ffmpeg/ffprobe CLI beside the app (usr/bin), so video *import*
          # (the transcode step shells out to 'ffmpeg') is self-contained
          # too — bundle_lib exclude-list above keeps their deps satisfied.
          cp /opt/ffmpeg/bin/ffmpeg /opt/ffmpeg/bin/ffprobe "$appdir/usr/bin/"
          export LD_LIBRARY_PATH="$PWD/$appdir/usr/lib"
          "$appdir/usr/bin/ffmpeg" -version >/dev/null

          # ── AppImage skeleton ──────────────────────────────────────
          cp packaging/linux/com.yawn.daw.desktop "$appdir/com.yawn.daw.desktop"
          cp assets/icon.png "$appdir/com.yawn.daw.png"
          mkdir -p "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp packaging/linux/com.yawn.daw.desktop \
             "$appdir/usr/share/applications/com.yawn.daw.desktop"
          cp assets/icon.png \
             "$appdir/usr/share/icons/hicolor/512x512/apps/com.yawn.daw.png"

          # Heredoc content must sit at the YAML block's base indent —
          # the literal-block dedent then puts it at column 0 for bash.
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$HERE/usr/bin:$PATH"
          cd "$HERE/usr/bin"   # assets/, models/ resolve relative to CWD
          exec ./YAWN "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          # appimagetool upstream only publishes a floating "continuous"
          # build — no per-version tags, so no meaningful hash pinning
          # (mirroring into our deps release like FFmpeg's is the
          # follow-up if this ever flakes). APPIMAGE_EXTRACT_AND_RUN
          # covers runners without /dev/fuse.
          curl -L -f -sS -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool \
            "$appdir" "YAWN-${version}-x86_64.AppImage"
          ls -la "YAWN-${version}-x86_64.AppImage"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YAWN-${{ matrix.platform }}
          path: YAWN-*-${{ matrix.platform }}.${{ matrix.archive-ext }}

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: YAWN-${{ matrix.platform }}
          path: |
            YAWN-*-linux.tar.gz
            YAWN-*-x86_64.AppImage

  release:
    needs: build
    # Only publish a GitHub release for real tag pushes; workflow_dispatch
    # runs the build job for artifact inspection but skips publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YAWN-windows/*.zip
            YAWN-linux/*.tar.gz
            YAWN-linux/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
