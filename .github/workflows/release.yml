name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger: builds + uploads the packaged artifacts (incl. the
  # bundled model + ONNX Runtime) for inspection WITHOUT publishing a
  # GitHub release — the `release` job is gated to tag pushes only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build-type: Release
            archive-ext: zip
          # Pinned (not ubuntu-latest): the Linux FFmpeg sonames the shim
          # probes (libavcodec.so.60 family) and the AppImage's glibc floor
          # (2.39) both come from this runner — don't let it float.
          - os: ubuntu-24.04
            platform: linux
            build-type: Release
            archive-ext: tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for version tag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavdevice-dev \
            ccache

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Mirrored in this repo's `deps` release — BtbN prunes dated
          # autobuilds within weeks (the 2026-07-18 pin 404'd), and the
          # rolling `latest` alias floats. Hash-checked so the toolchain
          # is exactly what we mirrored.
          $url = 'https://github.com/tkleisas/yawn/releases/download/deps/ffmpeg-win64.zip'
          $sha256 = '952b5fb1d32636d70ced1f8df65a51def4c576e1f8a834ee9d578ae0adc8d64c'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) {
            throw "FFmpeg zip sha256 mismatch — mirror tampered or URL wrong"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Python dependencies
        run: pip install jinja2

      # Cache the FetchContent git clones + built deps (SDL3, NAM, ableton_link,
      # VST3 SDK, eigen, …) — the dominant cost of the Linux build. Keyed on the
      # dependency declarations; an exact hit skips the ~1.2 GB of re-cloning
      # entirely. No restore-keys: a dep change must force a clean re-fetch.
      - name: Cache FetchContent deps (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('cmake/**', 'CMakeLists.txt') }}

      # Compiler cache so unchanged TUs (deps + YAWN) aren't recompiled. The
      # rolling key + restore-keys keeps a warm cache across releases; ccache
      # validates by content hash, so a stale restore is safe (just misses).
      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DYAWN_HAS_STEM_SEPARATION=ON -DYAWN_HAS_BASIC_PITCH=ON ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }} ${{ runner.os == 'Windows' && format('-DPython3_EXECUTABLE="{0}/python3.exe" -DPython_EXECUTABLE="{0}/python3.exe" -DFFMPEG_ROOT="{1}"', env.pythonLocation, env.FFMPEG_ROOT) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build-type }} --output-on-failure --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "YAWN-${version}-windows"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item build/bin/Release/YAWN.exe $dir/
          if (Test-Path build/bin/Release/yawn_vst3_host.exe) {
            Copy-Item build/bin/Release/yawn_vst3_host.exe $dir/
          }
          if (Test-Path build/bin/Release/assets) {
            Copy-Item -Recurse build/bin/Release/assets $dir/
          }
          if (Test-Path build/bin/Release/scripts) {
            Copy-Item -Recurse build/bin/Release/scripts $dir/
          }
          Get-ChildItem build/bin/Release/*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination $dir/
          # Bundle the Demucs stem-separation model so the app is self-
          # contained (onnxruntime.dll is already copied via *.dll above).
          New-Item -ItemType Directory -Path "$dir/models" -Force | Out-Null
          $modelUrl = 'https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx'
          Invoke-WebRequest -Uri $modelUrl -OutFile "$dir/models/htdemucs_4s.onnx" -UseBasicParsing
          $sz = (Get-Item "$dir/models/htdemucs_4s.onnx").Length
          if ($sz -ne 170681491) { throw "Model size mismatch: $sz (expected 170681491)" }
          if ($env:FFMPEG_ROOT -and (Test-Path "$env:FFMPEG_ROOT\bin")) {
            Copy-Item "$env:FFMPEG_ROOT\bin\*.dll" $dir/ -ErrorAction SilentlyContinue
            foreach ($exe in 'ffmpeg.exe','ffprobe.exe') {
              if (Test-Path "$env:FFMPEG_ROOT\bin\$exe") {
                Copy-Item "$env:FFMPEG_ROOT\bin\$exe" $dir/
              }
            }
          }
          Compress-Archive -Path $dir -DestinationPath "YAWN-${version}-windows.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="YAWN-${version}-linux"
          mkdir -p "$dir"
          cp build/bin/YAWN "$dir/"
          if [ -f build/bin/yawn_vst3_host ]; then
            cp build/bin/yawn_vst3_host "$dir/"
          fi
          if [ -d build/bin/assets ]; then
            cp -r build/bin/assets "$dir/"
          fi
          if [ -d build/bin/scripts ]; then
            cp -r build/bin/scripts "$dir/"
          fi
          # Bundle the ONNX Runtime shared lib beside the binary (its rpath
          # includes $ORIGIN) so stem separation / Basic Pitch run from the
          # package; -P preserves the libonnxruntime.so.1 -> .so.1.20.1 chain.
          find build/_deps -path '*onnxruntime*/lib/libonnxruntime.so*' -print0 \
            | xargs -0 cp -P -t "$dir/"
          # Bundle the Demucs stem-separation model (self-contained app).
          mkdir -p "$dir/models"
          curl -L -f -sS -o "$dir/models/htdemucs_4s.onnx" \
            "https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx"
          sz=$(stat -c%s "$dir/models/htdemucs_4s.onnx")
          if [ "$sz" != "170681491" ]; then
            echo "Model size mismatch: $sz (expected 170681491)"; exit 1
          fi
          tar czf "YAWN-${version}-linux.tar.gz" "$dir"

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        # Non-fatal: the tarball carries the dlopen fix and must publish
        # even if the (new, evolving) AppImage assembly flakes.
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          appdir="YAWN.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/lib"

          # App + payload. assets/ and models/ are resolved relative to
          # the process CWD, so AppRun cd's into usr/bin before exec.
          cp build/bin/YAWN "$appdir/usr/bin/"
          if [ -f build/bin/yawn_vst3_host ]; then
            cp build/bin/yawn_vst3_host "$appdir/usr/bin/"
          fi
          if [ -d build/bin/assets ]; then cp -r build/bin/assets "$appdir/usr/bin/"; fi
          if [ -d build/bin/scripts ]; then cp -r build/bin/scripts "$appdir/usr/bin/"; fi

          # ONNX Runtime (rpath $ORIGIN covers usr/bin, but LD_LIBRARY_PATH
          # in AppRun also covers usr/lib — put it with the other libs).
          find build/_deps -path '*onnxruntime*/lib/libonnxruntime.so*' -print0 \
            | xargs -0 cp -P -t "$appdir/usr/lib/"

          # Demucs model (size-verified, same as the tarball).
          mkdir -p "$appdir/usr/bin/models"
          curl -L -f -sS -o "$appdir/usr/bin/models/htdemucs_4s.onnx" \
            "https://github.com/tkleisas/yawn/releases/download/models-v1/htdemucs_4s.onnx"
          sz=$(stat -c%s "$appdir/usr/bin/models/htdemucs_4s.onnx")
          if [ "$sz" != "170681491" ]; then
            echo "Model size mismatch: $sz (expected 170681491)"; exit 1
          fi

          # ── FFmpeg runtime closure ─────────────────────────────────
          # The app dlopen()s libav* at runtime (FfmpegShim), so the
          # whole point of the AppImage is bundling them: walk the ldd
          # closure of the five libav libs and copy everything EXCEPT
          # core runtime / graphics drivers / audio servers — those must
          # come from the host (glibc versioning, GPU driver match, JACK
          # connectivity).
          bundle_lib() {
            local f="$1" base dst
            base="$(basename "$f")"
            case "$base" in
              libc.so.*|libstdc++.so.*|libm.so.*|libgcc_s.so.*|libpthread.so.*|\
              libdl.so.*|librt.so.*|ld-linux*.so.*|linux-vdso*|\
              libGL*.so.*|libEGL*.so.*|libGLX*.so.*|libGLdispatch*.so.*|\
              libasound.so.*|libjack.so.*|libpipewire*.so.*|libpulse*.so.*|\
              libX11.so.*|libxcb*.so.*|libwayland*.so.*|libdbus-1.so.*)
                return ;;
            esac
            dst="$appdir/usr/lib/$base"
            [ -f "$dst" ] && return 0
            cp -L "$f" "$dst"
            ldd "$dst" 2>/dev/null | awk '/=> \// {print $3} /^\// {print $1}' \
              | while read -r dep; do [ -n "$dep" ] && bundle_lib "$dep"; done
          }
          for soname in libavcodec.so.60 libavformat.so.60 libavutil.so.58 \
                        libswscale.so.7 libavdevice.so.60; do
            bundle_lib "/usr/lib/x86_64-linux-gnu/$soname"
          done

          # ── AppImage skeleton ──────────────────────────────────────
          cp packaging/linux/com.yawn.daw.desktop "$appdir/com.yawn.daw.desktop"
          cp assets/icon.png "$appdir/com.yawn.daw.png"
          mkdir -p "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp packaging/linux/com.yawn.daw.desktop \
             "$appdir/usr/share/applications/com.yawn.daw.desktop"
          cp assets/icon.png \
             "$appdir/usr/share/icons/hicolor/512x512/apps/com.yawn.daw.png"

          # Heredoc content must sit at the YAML block's base indent —
          # the literal-block dedent then puts it at column 0 for bash.
          cat > "$appdir/AppRun" <<'APPRUN'
#!/bin/bash
HERE="$(dirname "$(readlink -f "$0")")"
export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
export PATH="$HERE/usr/bin:$PATH"
cd "$HERE/usr/bin"   # assets/, models/ resolve relative to CWD
exec ./YAWN "$@"
APPRUN
          chmod +x "$appdir/AppRun"

          # appimagetool upstream only publishes a floating "continuous"
          # build — no per-version tags, so no meaningful hash pinning
          # (mirroring into our deps release like FFmpeg's is the
          # follow-up if this ever flakes). APPIMAGE_EXTRACT_AND_RUN
          # covers runners without /dev/fuse.
          curl -L -f -sS -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool \
            "$appdir" "YAWN-${version}-linux-x86_64.AppImage"
          ls -la "YAWN-${version}-linux-x86_64.AppImage"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YAWN-${{ matrix.platform }}
          path: YAWN-*-${{ matrix.platform }}.${{ matrix.archive-ext }}

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: YAWN-${{ matrix.platform }}
          path: |
            YAWN-*-linux.tar.gz
            YAWN-*-linux-x86_64.AppImage

  release:
    needs: build
    # Only publish a GitHub release for real tag pushes; workflow_dispatch
    # runs the build job for artifact inspection but skips publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YAWN-windows/*.zip
            YAWN-linux/*.tar.gz
            YAWN-linux/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
